<!doctype html>
<html>
<head>
  <style>
    :fullscreen {
      cursor: none;
    }
    :fullscreen button {
      display: none;
    }
  </style>
</head>

<body style="
  margin: 0;
  background: #000;
  height: 100vh;
  display: grid;
  place-items: center;
">
  <button
    onclick="document.documentElement.requestFullscreen()"
    style="
      padding: 10px 14px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font: 14px sans-serif;
      cursor: pointer;
    "
  >
    FULL SCREEN
  </button>

  <script>
    ondblclick = () =>
      document.fullscreenElement && document.exitFullscreen()
  </script>
</body>
</html>
